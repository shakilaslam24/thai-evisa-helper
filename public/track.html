<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Track Your Application</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2324509b'/><text y='68' x='50' text-anchor='middle' font-size='54' font-family='sans-serif' font-weight='bold' fill='white'>DF</text></svg>">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .track-page {
      min-height: 100vh; padding: 24px 16px 48px;
      background: linear-gradient(160deg, var(--brand-900), var(--brand-700) 55%, var(--accent-600));
    }
    .track-shell { max-width: 640px; margin: 0 auto; }
    .track-head { text-align: center; color: #fff; padding: 22px 0 26px; }
    .track-head h1 { font-size: 23px; }
    .track-head p { margin: 6px 0 0; opacity: .85; font-size: 14px; }
    .track-logo {
      width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 14px;
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      display: grid; place-items: center; font-weight: 800; font-size: 19px; color: #fff;
    }
    .track-card {
      background: var(--surface); border-radius: 16px; padding: 24px;
      box-shadow: 0 18px 44px rgba(8,20,45,.32); margin-bottom: 16px;
    }
    .track-steps { display: flex; gap: 4px; margin: 14px 0 6px; }
    .track-step { flex: 1; height: 6px; border-radius: 3px; background: var(--neutral-bg); }
    .track-step--done { background: var(--accent-500); }
    .track-step--rejected { background: #dc2626; }
    .track-app { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .track-app + .track-app { margin-top: 12px; }
    .track-msg { font-size: 15px; font-weight: 550; margin: 10px 0 0; }
    .track-needed {
      background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px;
      padding: 12px 14px; margin-top: 14px; font-size: 13.5px;
    }
    .track-needed ul { margin: 6px 0 0; padding-left: 20px; }
    .track-foot { text-align: center; color: rgba(255,255,255,.8); font-size: 13px; padding-top: 8px; }
    .track-foot a { color: #fff; }
  </style>
</head>
<body>
  <div class="track-page">
    <div class="track-shell">
      <div class="track-head">
        <div class="track-logo" id="logo">DF</div>
        <h1 id="companyName">Track Your Application</h1>
        <p id="companyTag">Check the status of your visa or package application</p>
      </div>
      <div id="root"><div class="track-card"><div class="spinner"></div></div></div>
      <div class="track-foot" id="contact"></div>
    </div>
  </div>
  <script type="module" src="/js/track.js"></script>
</body>
</html>
